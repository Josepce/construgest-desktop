name: Gerar ConstruGest Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe e 163 funcoes criticas
        run: |
          node --check src/server.js
          node --check electron-main.cjs
          node --check public/app.js
          node scripts/check-critical-functions.cjs

      - name: Gerar EXE portatil
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar instalador completo
        run: npx electron-builder --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar atualizador seguro
        run: npx electron-builder --win nsis --x64 --config electron-builder-update.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir os tres EXEs
        shell: pwsh
        run: |
          $expected = @(
            'dist/ConstruGest-Portable-4.0.0-x64.exe',
            'dist/ConstruGest-Setup-4.0.0-x64.exe',
            'dist/ConstruGest-Atualizacao-4.0.0-x64.exe'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Arquivo esperado nao foi gerado: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Disponibilizar EXEs
        uses: actions/upload-artifact@v4
        with:
          name: ConstruGest-Windows
          path: |
            dist/ConstruGest-Portable-4.0.0-x64.exe
            dist/ConstruGest-Setup-4.0.0-x64.exe
            dist/ConstruGest-Atualizacao-4.0.0-x64.exe
          if-no-files-found: error
          retention-days: 30
