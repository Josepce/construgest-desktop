name: Gerar Porto Prime Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder-update.yml'
      - 'build/**'
      - 'electron-main.cjs'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: porto-prime-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Descobrir cache do npm
        id: npm-cache-dir
        shell: pwsh
        run: |
          "dir=$(npm config get cache)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restaurar cache do npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: porto-prime-npm-node22-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            porto-prime-npm-node22-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe e testes criticos
        run: |
          node --check src/server.js
          node --check src/trial-license.js
          node --check electron-main.cjs
          node --check public/app.js
          node scripts/check-critical-functions.cjs
          node scripts/check-trial-license.cjs
          node scripts/check-products.mjs
          node scripts/check-quote-search.cjs

      - name: Gerar EXE portatil e instalador
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar atualizador seguro
        run: npx electron-builder --win nsis --x64 --config electron-builder-update.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir EXEs e tamanhos
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe"
          )

          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Arquivo esperado nao foi gerado: $file"
            }

            $sizeMB = [math]::Round((Get-Item $file).Length / 1MB, 2)
            if ((Get-Item $file).Length -lt 1MB) {
              throw "Arquivo suspeito ou vazio: $file"
            }

            Write-Host "OK: $file - $sizeMB MB"
          }

      - name: Publicar Release do Porto Prime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"

          $assets = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe"
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag ja existe. Atualizando os arquivos..."
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            Write-Host "Criando Release $tag..."
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Porto Prime $version" --notes "Versao $version do Porto Prime para Windows. Arquivos: Portable, Instalador e Atualizador seguro."
          }

      - name: Resumo da compilacao
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host ""
          Write-Host "========================================"
          Write-Host "PORTO PRIME $version - BUILD CONCLUIDO"
          Write-Host "========================================"
          Write-Host "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version"
