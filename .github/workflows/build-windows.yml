name: Gerar Porto Prime Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'electron-builder-update.yml'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe, funcoes criticas e demonstracao
        run: |
          node --check src/server.js
          node --check src/trial-license.js
          node --check electron-main.cjs
          node --check public/app.js
          node scripts/check-critical-functions.cjs
          node scripts/check-trial-license.cjs
          node scripts/check-products.mjs
          node scripts/check-quote-search.cjs

      - name: Gerar EXE portatil
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar instalador completo
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar atualizador seguro
        run: npx electron-builder --win nsis --x64 --config electron-builder-update.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir os tres EXEs
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Arquivo esperado nao foi gerado: $file"
            }
            Write-Host "OK: $file"
          }

      - name: Limpar artifact PortoPrime antigo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "PortoPrime-Windows") | .id'
          foreach ($id in $artifacts) {
            Write-Host "Removendo artifact antigo: $id"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id"
          }

      - name: Disponibilizar EXEs
        uses: actions/upload-artifact@v4
        with:
          name: PortoPrime-Windows
          path: |
            dist/PortoPrime-Portable-*-x64.exe
            dist/PortoPrime-Setup-*-x64.exe
            dist/PortoPrime-Atualizacao-*-x64.exe
          if-no-files-found: error
          retention-days: 1
