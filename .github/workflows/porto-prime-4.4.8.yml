name: Porto Prime 4.4.8 - Validacao e build Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/4.4.8-login-stability"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe JavaScript
        shell: pwsh
        run: |
          node --check src/server.js
          node --check electron-main.cjs
          node --check public/app.js
          node --check scripts/check-password-recovery.cjs

      - name: Validar funcoes essenciais e login
        run: |
          npm run check:critical
          npm run check:password-recovery
          npm run check:server
          npm run check:data-directory

      - name: Validar modulos comerciais
        run: |
          npm run check:trial
          npm run check:products
          npm run check:quotes
          npm run check:reports
          npm run check:stability
          npm run check:stock-intelligence
          npm run check:seller-performance

      - name: Gerar instalador e versao portatil Windows
        run: npm run build:all
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Criar ZIP dos executaveis Windows
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(Get-ChildItem dist -Filter "PortoPrime-*.exe" -File | Where-Object { $_.Name -notlike "*.__uninstaller.exe" })
          if ($files.Count -lt 2) { throw "Esperados pelo menos dois executaveis; encontrados: $($files.Count)" }
          $zip = "dist/PortoPrime-$version-Windows.zip"
          Compress-Archive -Path $files.FullName -DestinationPath $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1MB) { throw "ZIP ausente ou suspeito: $zip" }
          Write-Host "ZIP criado: $zip"

      - name: Publicar artefatos para download
        uses: actions/upload-artifact@v4
        continue-on-error: true # A cota temporaria pode estar cheia; o build e o ZIP devem continuar disponiveis no log
        with:
          name: PortoPrime-Windows-${{ github.run_number }}
          path: |
            dist/PortoPrime-*.exe
            dist/PortoPrime-*.zip
            dist/PortoPrime-*.blockmap
            dist/PortoPrime-*.yml
          if-no-files-found: error
          retention-days: 14
